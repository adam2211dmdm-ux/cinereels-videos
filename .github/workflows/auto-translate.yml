# CineReels auto-translate — runs WITHOUT any human approval.
#
# Every 30 minutes (and whenever videos.json changes, i.e. Adam publishes a
# new episode) this workflow finds published episodes that have a video but
# no subtitles, transcribes them with faster-whisper, detects burned-in
# subtitles with OCR, translates EN<->AR with Argos Translate packages
# (Helsinki-NLP Opus-MT, pre-converted CTranslate2 models, offline, CPU),
# writes .vtt files, updates videos.json, and commits + pushes with
# GITHUB_TOKEN.
#
# No approval tap is needed: pushes made with GITHUB_TOKEN do not
# re-trigger workflows, so the push-on-videos.json trigger cannot loop.
# The old 30-min Muse cron (cinereels-auto-translate) must NOT push the
# same files anymore once this is live — it becomes a daily monitor only.
name: Auto-translate subtitles

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "videos.json"

# Never run two translations at once (they would both edit videos.json).
concurrency:
  group: auto-translate
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Install system tools (ffmpeg + tesseract ara/eng)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg tesseract-ocr tesseract-ocr-ara tesseract-ocr-eng

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install faster-whisper Pillow ctranslate2 sentencepiece

      # Argos Translate packages (Helsinki-NLP Opus-MT, pre-converted
      # CTranslate2 models, ~85 MB each) are downloaded from the Argos
      # package index and unzipped into models-ct2/ (cached between runs;
      # the cache key follows the index, so a new package version refreshes
      # it automatically). No torch, no conversion step.
      - name: Fetch Argos package index
        id: argos-index
        run: |
          curl -sL -o argos-index.json "https://raw.githubusercontent.com/argosopentech/argospm-index/main/index.json"
          python - <<'PY'
          import hashlib, json, os
          d = json.load(open("argos-index.json"))
          links = {}
          for p in d:
              if p.get("from_code") == "en" and p.get("to_code") == "ar":
                  links["en_ar"] = p["links"][0]
              if p.get("from_code") == "ar" and p.get("to_code") == "en":
                  links["ar_en"] = p["links"][0]
          assert set(links) == {"en_ar", "ar_en"}, links
          json.dump(links, open("argos-links.json", "w"))
          h = hashlib.sha256(json.dumps(links, sort_keys=True).encode()).hexdigest()[:12]
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("links_hash=%s\n" % h)
          print("en_ar:", links["en_ar"])
          print("ar_en:", links["ar_en"])
          PY

      - name: Restore Argos models
        id: argos-cache
        uses: actions/cache@v4
        with:
          path: models-ct2
          key: argos-models-${{ steps.argos-index.outputs.links_hash }}

      - name: Download Argos models (cache miss only)
        if: steps.argos-cache.outputs.cache-hit != 'true'
        run: |
          set -e
          mkdir -p models-ct2
          python - <<'PY'
          import json, os, time, urllib.request, urllib.error, zipfile
          # argos-net.com blocks Python's default User-Agent (and the
          # runner IP range is flaky) — use a browser UA + retries.
          # (2026-11-24: the first 3 runs all failed on this step.)
          UA = {"User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36"}
          links = json.load(open("argos-links.json"))
          for name, url in links.items():
              path = "models-ct2/translate-%s.argosmodel" % name
              for attempt in (1, 2, 3):
                  try:
                      req = urllib.request.Request(url, headers=UA)
                      with urllib.request.urlopen(req, timeout=600) as r, open(path, "wb") as f:
                          f.write(r.read())
                      break
                  except (urllib.error.URLError, TimeoutError, OSError) as e:
                      print("attempt %d for %s failed: %s" % (attempt, name, e))
                      if attempt == 3:
                          raise
                      time.sleep(15)
              with zipfile.ZipFile(path) as z:
                  z.extractall("models-ct2/translate-%s" % name)
              os.remove(path)
          PY
          ls models-ct2/translate-en_ar/en_ar models-ct2/translate-ar_en/ar_en

      - name: Run auto-translate (max 2 episodes)
        run: python tools/auto_translate_action.py

      - name: Commit and push (only if something changed)
        run: |
          set -e
          if [ ! -f .auto-translate-summary.json ]; then
            echo "No summary file — the script did not run. Failing."
            exit 1
          fi
          CHANGED=$(python -c "import json; print(' '.join(json.load(open('.auto-translate-summary.json'))['changed_paths']))")
          if [ -z "$CHANGED" ]; then
            echo "Nothing to do — no subtitles created, no manifest change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # shellcheck disable=SC2086
          git add $CHANGED
          MSG=$(python -c "import json; print(json.load(open('.auto-translate-summary.json'))['commit_message'])")
          git commit -m "$MSG"
          git push
