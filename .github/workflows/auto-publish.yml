name: Auto-publish series

# Adam imports a series in the app's Admin and taps "Publish for
# everyone" — the app opens a pre-filled GitHub issue. This workflow
# (every 30 min) turns the oldest open "[CineReels Publish]" issue
# into a public series: harvest the streams via APIShort, bake them
# into videos.enc, commit, and close the issue. The manifest key/IV
# come from repo secrets MANIFEST_KEY / MANIFEST_IV; the harvest is
# anonymous (no API key anywhere).
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ensure publish label exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create publish --color 0E8A16 --description "Auto-publish request from the app" || true

      - name: Publish one pending series
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          MANIFEST_KEY: ${{ secrets.MANIFEST_KEY }}
          MANIFEST_IV: ${{ secrets.MANIFEST_IV }}
        run: python3 tools/auto_publish_action.py

      - name: Commit manifest
        id: commit
        run: |
          if [ ! -f publish-result.txt ] || ! grep -q '^changed=true' publish-result.txt; then
            echo "nothing to publish"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TITLE=$(grep '^title=' publish-result.txt | cut -d= -f2-)
          EPS=$(grep '^episodes=' publish-result.txt | cut -d= -f2-)
          PROVIDER=$(grep '^provider=' publish-result.txt | cut -d= -f2-)
          git config user.name "cinereels-bot"
          git config user.email "cinereels-bot@users.noreply.github.com"
          # Commit FIRST, then pull --rebase: pulling with the script's
          # videos.enc edit still unstaged makes git refuse the rebase
          # ("cannot pull with rebase: You have unstaged changes", exit
          # 128) — that killed runs #4 and #5 on 2026-11-25.
          git add videos.enc
          git commit -m "Add ${TITLE} — ${EPS} episodes (${PROVIDER})"
          # Retry pull+push: the auto-translate Action commits subtitles
          # to videos.enc every 30 min, so a push can lose the race to
          # a fresh subtitle commit. On rebase conflict, abort and retry;
          # a failed run retries from a fresh checkout next schedule.
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin main; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git rebase --abort || true
            sleep 10
          done
          echo "push failed after 3 attempts"
          exit 1

      - name: Close issue
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE=$(grep '^issue=' publish-result.txt | cut -d= -f2-)
          TITLE=$(grep '^title=' publish-result.txt | cut -d= -f2-)
          EPS=$(grep '^episodes=' publish-result.txt | cut -d= -f2-)
          gh issue close "$ISSUE" --comment "✅ Published: ${TITLE} — ${EPS} episodes are now live in the catalog for everyone. Arabic subtitles will generate automatically over the next hours."
